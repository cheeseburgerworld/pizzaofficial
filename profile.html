<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — Pizza Official</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%95%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pizza-theme.css">
<style>
  a.logo { text-decoration:none; } a.tab { text-decoration:none; display:inline-block; }

  /* ── Profile page ── */
  .pf-wrap { max-width:760px; margin:0 auto; padding:40px 20px 90px; }

  .pf-gate { display:none; text-align:center; padding:80px 20px; }
  .pf-gate.show { display:block; }
  .pf-gate-title { font-family:var(--font-display); font-size:42px; letter-spacing:1.5px; color:var(--red); line-height:1; margin-bottom:14px; }
  .pf-gate-text { font-size:15px; color:var(--text-2); line-height:1.7; max-width:440px; margin:0 auto 26px; }
  .pf-gate-signin { display:flex; gap:8px; max-width:340px; margin:0 auto; }
  .pf-gate-input { flex:1; min-width:0; background:var(--inset); border:1px solid var(--border-interactive); color:var(--text); font-family:var(--font-body); font-size:14px; padding:11px 13px; }
  .pf-gate-btn { font-family:var(--font-body); font-weight:600; font-size:14px; letter-spacing:0.5px; padding:11px 20px; cursor:pointer; background:var(--bsky); color:#fff; border:none; flex-shrink:0; }
  .pf-gate-btn:hover { background:var(--bsky-hover); }
  .pf-gate-err { color:var(--error); font-size:12px; margin-top:10px; display:none; }

  .pf-body { display:none; }
  .pf-body.show { display:block; }

  .pf-id { display:flex; align-items:center; gap:18px; margin-bottom:30px; }
  .pf-avatar { width:72px; height:72px; border-radius:50%; flex-shrink:0; background:var(--raised); border:1px solid var(--border); overflow:hidden; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:34px; color:var(--red); }
  .pf-avatar img { width:100%; height:100%; object-fit:cover; }
  .pf-id-text { min-width:0; }
  .pf-name { font-family:var(--font-display); font-size:40px; letter-spacing:0.5px; color:var(--text); line-height:1; }
  .pf-handle { font-size:13px; color:var(--bsky); margin-top:5px; word-break:break-all; }
  .pf-rank { display:inline-flex; align-items:center; gap:8px; margin-top:9px; font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--text-3); text-decoration:none; transition:color .12s; }
  .pf-rank:hover { color:var(--text-2); }
  .pf-rank:hover b { color:var(--red-hover); }
  .pf-rank-emoji { font-size:15px; font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif; }
  .pf-rank b { color:var(--red); font-weight:400; }

  .pf-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:42px; }
  .pf-stat { background:var(--surface); border:1px solid var(--border); padding:18px 10px; text-align:center; }
  .pf-num { font-family:var(--font-display); font-size:40px; line-height:1; color:var(--text); }
  .pf-lab { font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-3); margin-top:7px; }

  .pf-sec { margin-bottom:42px; }
  .pf-sec-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; }
  .pf-eyebrow { font-family:var(--font-display); font-size:26px; letter-spacing:1.5px; color:var(--red); }
  .pf-sec-note { font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--text-3); }

  /* ── BADGE CASE ── */
  .pf-badges { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .badge { background:var(--surface); border:1px solid var(--border); padding:18px 16px; display:flex; flex-direction:column; align-items:center; text-align:center; position:relative; }
  .badge::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--tier,var(--border)); }
  .badge.locked { opacity:0.55; }
  .badge-tile { width:56px; height:56px; border-radius:10px; background:var(--inset); border:2px solid var(--tier,var(--border)); display:flex; align-items:center; justify-content:center; font-size:30px; line-height:1; margin-bottom:12px; font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif; }
  .badge.locked .badge-tile { filter:grayscale(1) brightness(0.7); border-color:var(--border); }
  .badge-name { font-family:var(--font-display); font-size:18px; letter-spacing:0.8px; color:var(--text); line-height:1.1; }
  .badge-tier { font-size:10px; letter-spacing:1.5px; text-transform:uppercase; margin-top:5px; color:var(--tier,var(--text-3)); font-weight:600; }
  .badge.locked .badge-tier { color:var(--text-3); }
  .badge-prog { font-size:11px; color:var(--text-3); margin-top:8px; line-height:1.4; }
  .badge-count { color:var(--text); }

  .pf-badges-empty { grid-column:1/-1; text-align:center; padding:30px 20px; color:var(--text-3); font-size:13px; line-height:1.6; }
  .pf-badge-divider { grid-column:1/-1; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--border-interactive); margin:14px 0 2px; padding-top:14px; border-top:1px solid var(--raised); }

  .pf-reviews { display:flex; flex-direction:column; gap:8px; }
  .pf-rv { display:flex; align-items:center; gap:13px; padding:14px 15px; background:var(--surface); border:1px solid var(--raised); border-radius:9px; cursor:pointer; transition:border-color .12s, background .12s, transform .12s; text-decoration:none; }
  .pf-rv:hover { border-color:var(--red); background:var(--surface); transform:translateX(2px); }
  .pf-rv.leg { border-color:rgba(255,214,10,0.35); }
  .pf-rv.leg:hover { border-color:var(--rate-legendary); }
  .pf-rv-date { flex-shrink:0; width:58px; text-align:center; font-size:10px; letter-spacing:0.5px; text-transform:uppercase; color:var(--text-3); line-height:1.35; }
  .pf-rv-body { flex:1; min-width:0; }
  .pf-rv-name { font-size:14px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pf-rv-name.legendary { color:var(--rate-legendary); }
  .pf-rv-meta { font-size:11px; color:var(--text-3); margin-top:2px; }
  .pf-rv-right { display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .pf-rv-chip { font-size:16px; font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif; }
  .pf-rv-arrow { color:var(--text-3); font-size:13px; transition:color .12s; }
  .pf-rv:hover .pf-rv-arrow { color:var(--red); }
  .pf-rv-empty { text-align:center; padding:34px 20px; color:var(--text-3); font-size:13px; line-height:1.7; }
  .pf-rv-empty a { color:var(--red); text-decoration:none; }
  .pf-more { width:100%; margin-top:4px; background:none; border:1px solid var(--border); color:var(--text-2); font-family:var(--font-body); font-size:12px; letter-spacing:0.5px; padding:12px; cursor:pointer; transition:border-color .12s, color .12s; }
  .pf-more:hover { border-color:var(--red); color:var(--red); }

  .pf-signout { margin-top:10px; text-align:center; }
  .signout-link { background:none; border:1px solid var(--border); color:var(--text-3); font-family:var(--font-body); font-size:12px; letter-spacing:0.5px; padding:9px 18px; cursor:pointer; }
  .signout-link:hover { border-color:var(--error); color:var(--error); }

  .site-footer { border-top:1px solid var(--border); background:var(--surface); margin-top:40px; padding:22px 20px; }
  .footer-inner { max-width:1100px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .footer-links { display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .footer-links a { font-family:var(--font-body); font-size:12px; letter-spacing:0.5px; color:var(--text-2); text-decoration:none; }
  .footer-links a:hover { color:var(--red); }
  .footer-copy { font-size:11px; color:var(--text-3); }

  @media (max-width:760px) {
    .nav { gap:12px; } .nav-left { gap:14px; min-width:0; flex:1; }
    .tabs { overflow-x:auto; -webkit-overflow-scrolling:touch; gap:2px; scrollbar-width:none; }
    .tabs::-webkit-scrollbar { display:none; }
    .tab { flex:0 0 auto; white-space:nowrap; padding:8px 11px; }
    .pf-name { font-size:32px; }
    .pf-stats { gap:8px; }
    .pf-num { font-size:32px; }
    .pf-badges { grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); }
    .footer-inner { flex-direction:column; align-items:flex-start; gap:14px; }
    .pf-gate-signin { flex-direction:column; }
  }
</style>
</head>

<div class="nav">
  <div class="nav-left">
    <a class="logo" href="/">PIZZA<span class="bolt">⚡</span>OFFICIAL</a>
    <div class="tabs">
      <a class="tab" href="/database.html">Database</a>
      <a class="tab" href="/map.html">Map</a>
      <a class="tab" href="/submit.html">Post a Review</a>
    </div>
  </div>
  <div class="nav-id" id="navId"><span class="dot out"></span>Not signed in</div>
</div>

<div class="pf-wrap">

  <div class="pf-gate" id="pfGate">
    <div class="pf-gate-title">Your profile</div>
    <p class="pf-gate-text">Sign in with Bluesky to see your stats, your badge case, and every review you've submitted.</p>
    <div class="pf-gate-signin">
      <input type="text" class="pf-gate-input" id="pfHandleInput" placeholder="you.bsky.social" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="pf-gate-btn" onclick="doSignIn()">Sign in</button>
    </div>
    <div class="pf-gate-err" id="pfGateErr"></div>
  </div>

  <div class="pf-body" id="pfBody">

    <div class="pf-id">
      <div class="pf-avatar" id="pfAvatar"></div>
      <div class="pf-id-text">
        <div class="pf-name" id="pfName">—</div>
        <div class="pf-handle" id="pfHandle">—</div>
        <a class="pf-rank" href="/ranks.html"><span class="pf-rank-emoji" id="pfRankEmoji"></span><span id="pfRank">—</span></a>
      </div>
    </div>

    <div class="pf-stats">
      <div class="pf-stat"><div class="pf-num" id="pfCount">0</div><div class="pf-lab">Reviews</div></div>
      <div class="pf-stat"><div class="pf-num" id="pfCities">0</div><div class="pf-lab">Cities</div></div>
      <div class="pf-stat"><div class="pf-num" id="pfBadgeCount">0</div><div class="pf-lab">Badges</div></div>
    </div>

    <div class="pf-sec">
      <div class="pf-sec-head">
        <span class="pf-eyebrow">Badge case</span>
        <span class="pf-sec-note">Earned by posting</span>
      </div>
      <div class="pf-badges" id="pfBadges"></div>
    </div>

    <div class="pf-sec">
      <div class="pf-sec-head">
        <span class="pf-eyebrow">Your reviews</span>
        <span class="pf-sec-note" id="pfRvNote"></span>
      </div>
      <div class="pf-reviews" id="pfReviews"></div>
    </div>

    <div class="pf-signout"><button class="signout-link" onclick="doSignOut()">Sign out</button></div>

  </div>
</div>

<script src="pizza-config.js"></script>
<script type="module">
import { initAuth, signIn, signOut } from '/auth.js';

/* RANKS/rankFor now live in pizza-config.js — single source of truth
   shared with ranks.html, loaded via the <script src="pizza-config.js">
   tag below, before this module script runs. */

/* ============================================================
   BADGE ENGINE — pure function of the contributor's reviews.
   Same shape as CBDB's: one style-exploration badge, one badge per
   style, plus price/tone/range badges. Swapped Burger Explorer's
   5 styles for pizza's 7; "Skip It" honesty badge, spend badges,
   and Globetrotter are protocol-level, unchanged.
   ============================================================ */
const TIER_COLORS = ['var(--rate-skip-fill)','var(--rate-worth)','var(--gold)','var(--apex)'];
const LABELS = {
  expertise: ['Rookie','Regular','Seasoned','Expert'],
  range:     ['Local','Traveler','Voyager','Worldly']
};
const STYLES = ['NY Style','Neapolitan','Roman','Detroit / Sicilian','Deep Dish','Tavern','Fast / Counter'];
const LADDERS = { count: [1, 5, 10, 25], city: [3, 7, 12, 20] };

function tierFor(n, ladder, labelSet){
  let idx=-1;
  ladder.forEach((min,i)=>{ if(n>=min) idx=i; });
  if(idx<0) return null;
  return { idx, color:TIER_COLORS[idx], label:labelSet[idx] };
}

function computeBadges(mine){
  const badges=[];

  const cityCount = new Set(mine.map(r=>(r.loc||'').trim()).filter(Boolean)).size;
  badges.push({ key:'globetrotter', name:'Globetrotter', glyph:'🌍',
    count:cityCount, tier:tierFor(cityCount, LADDERS.city, LABELS.range), unit:'cities' });

  const stylesHit = new Set(mine.map(r=>(r.style||'').trim()).filter(s=>STYLES.includes(s)));
  badges.push({ key:'explorer', name:'Pizza Explorer', glyph:'✨',
    count:stylesHit.size, unit:'styles', single:true, target:STYLES.length,
    tier: stylesHit.size>=STYLES.length ? { idx:3, color:TIER_COLORS[3], label:'Complete' } : null });

  const bigSpend = mine.filter(r=>(r.tier||'')==='$$$').length;
  badges.push({ key:'bigspender', name:'Big Spender', glyph:'💸',
    count:bigSpend, tier:tierFor(bigSpend, LADDERS.count, LABELS.expertise), unit:'$$$ spots' });

  const bigValue = mine.filter(r=>(r.tier||'')==='$').length;
  badges.push({ key:'bigvalue', name:'Big on Value', glyph:'🏷️',
    count:bigValue, tier:tierFor(bigValue, LADDERS.count, LABELS.expertise), unit:'$ spots' });

  const honest = mine.filter(r=>(r.rating||'')==='skip').length;
  badges.push({ key:'honest', name:'Tough Crowd', glyph:'🧂',
    count:honest, tier:tierFor(honest, LADDERS.count, LABELS.expertise), unit:'Skip Its' });

  const styleCounts={};
  mine.forEach(r=>{ const s=(r.style||'').trim(); if(s){ styleCounts[s]=(styleCounts[s]||0)+1; } });
  STYLES.forEach(style=>{
    const n=styleCounts[style]||0;
    badges.push({ key:'style:'+style, name:style+' Pizza', glyph:'🍕',
      count:n, tier:tierFor(n, LADDERS.count, LABELS.expertise), unit:style });
  });

  return badges;
}

/* ============================================================
   AUTH — mirrors submit.html's inline gate pattern.
   ============================================================ */
const state = { signedIn:false, did:null, handle:null, displayName:null, avatar:null };

window.doSignIn = async function(){
  const input = document.getElementById('pfHandleInput');
  const err = document.getElementById('pfGateErr');
  const handle = (input.value || '').trim();
  if (!handle) { err.textContent = 'Enter your Bluesky handle'; err.style.display = 'block'; input.focus(); return; }
  err.style.display = 'none';
  try { await signIn(handle); }
  catch (e) { err.textContent = e.message || 'Sign-in failed'; err.style.display = 'block'; }
};
document.getElementById('pfHandleInput').addEventListener('keydown', e => { if (e.key === 'Enter') window.doSignIn(); });

window.doSignOut = function(){ signOut(); };

// Surface a returned auth_error the same way index.html/submit.html do.
(function showReturnedAuthError(){
  const params = new URLSearchParams(location.search);
  const err = params.get('auth_error');
  if (!err) return;
  const el = document.getElementById('pfGateErr');
  if (el) { el.textContent = 'Sign-in failed: ' + decodeURIComponent(err); el.style.display = 'block'; }
  params.delete('auth_error');
  history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params.toString() : ''));
})();

function avatarInitial(){ return (state.displayName || state.handle || '?').charAt(0).toUpperCase(); }

function renderBadge(b){
  const earned = !!b.tier;
  const tierColor = earned ? b.tier.color : 'var(--border)';
  const tierLabel = earned ? b.tier.label : 'Locked';
  const prog = b.single
    ? '<span class="badge-count">'+b.count+'</span> / '+b.target+' '+b.unit
    : '<span class="badge-count">'+b.count+'</span> '+b.unit;
  return '<div class="badge'+(earned?'':' locked')+'" style="--tier:'+tierColor+'">'+
    '<div class="badge-tile">'+b.glyph+'</div>'+
    '<div class="badge-name">'+b.name+'</div>'+
    '<div class="badge-tier">'+tierLabel+'</div>'+
    '<div class="badge-prog">'+prog+'</div>'+
  '</div>';
}

function render(){
  const signedIn = !!state.signedIn;
  document.getElementById('pfGate').classList.toggle('show', !signedIn);
  document.getElementById('pfBody').classList.toggle('show', signedIn);
  const navId = document.getElementById('navId');
  navId.innerHTML = signedIn ? '<span class="dot"></span>@'+state.handle : '<span class="dot out"></span>Not signed in';
  if(!signedIn) return;

  const mine = (typeof myReviews==='function') ? myReviews(state) : [];
  const cities = new Set(mine.map(r=>(r.loc||'').trim()).filter(Boolean)).size;
  const rk = rankFor(mine.length);

  const av=document.getElementById('pfAvatar');
  if(state.avatar){
    av.innerHTML='<img src="'+state.avatar+'" alt="" onerror="this.parentNode.textContent=\''+avatarInitial()+'\'">';
  } else { av.textContent=avatarInitial(); }
  document.getElementById('pfName').textContent = state.displayName || state.handle || '—';
  document.getElementById('pfHandle').textContent = state.handle ? '@'+state.handle : '';
  document.getElementById('pfRankEmoji').textContent = rk.badge || '•';
  document.getElementById('pfRank').innerHTML = 'Rank · <b>'+rk.name+'</b>';

  const badges = computeBadges(mine);
  const earnedCount = badges.filter(b=>b.tier).length;
  document.getElementById('pfCount').textContent = mine.length;
  document.getElementById('pfCities').textContent = cities;
  document.getElementById('pfBadgeCount').textContent = earnedCount;

  const bWrap=document.getElementById('pfBadges');
  if(!mine.length){
    bWrap.innerHTML='<div class="pf-badges-empty">Post your first review to start earning badges. Each pizza style is its own badge to level up.</div>';
  } else {
    const earned = badges.filter(b=>b.tier).sort((a,b)=> (b.tier.idx||0) - (a.tier.idx||0));
    const locked = badges.filter(b=>!b.tier);
    let html = earned.map(renderBadge).join('');
    if(earned.length && locked.length) html += '<div class="pf-badge-divider">Not yet earned</div>';
    html += locked.map(renderBadge).join('');
    bWrap.innerHTML = html;
  }

  document.getElementById('pfRvNote').textContent = mine.length ? mine.length+(mine.length===1?' review':' reviews') : '';
  rvShown = PER_PAGE;
  renderReviews(mine);
}

const PER_PAGE = 6;
let rvShown = PER_PAGE;

function reviewRow(r){
  const rt = RATING[r.rating] || { glyph:'•', color:'var(--text-3)' };
  const leg = r.legendaryCanonical === true;
  const url = (typeof bskyWebUrl==='function') ? bskyWebUrl(r.bskyUri, r.by) : '';
  const glyphColor = r.rating==='skip' ? 'var(--rate-skip-text)' : rt.color;
  const meta = [r.loc, r.style].filter(Boolean).join(' · ');
  const dateStr = (typeof shortDate==='function' && r.createdAt) ? shortDate(r.createdAt) : '';
  const dateHtml = dateStr ? dateStr.replace(' ', '<br>') : '';
  const tag = url ? 'a href="'+url+'" target="_blank" rel="noopener"' : 'div';
  const close = url ? 'a' : 'div';
  return '<'+tag+' class="pf-rv'+(leg?' leg':'')+'">'+
    '<div class="pf-rv-date">'+dateHtml+'</div>'+
    '<div class="pf-rv-body"><div class="pf-rv-name'+(leg?' legendary':'')+'">'+r.name+'</div>'+
    '<div class="pf-rv-meta">'+meta+'</div></div>'+
    '<div class="pf-rv-right">'+
      '<span class="pf-rv-chip" style="color:'+glyphColor+'">'+rt.glyph+'</span>'+
      (url?'<span class="pf-rv-arrow">↗</span>':'')+
    '</div>'+
  '</'+close+'>';
}

function renderReviews(mine){
  const rvWrap=document.getElementById('pfReviews');
  if(!mine.length){
    rvWrap.innerHTML='<div class="pf-rv-empty">No reviews yet.<br><a href="/submit.html">Post your first one →</a></div>';
    return;
  }
  const shown = mine.slice(0, rvShown);
  let html = shown.map(reviewRow).join('');
  if(mine.length > rvShown){
    const remaining = mine.length - rvShown;
    html += '<button class="pf-more" id="pfMore">Show more · '+remaining+' left</button>';
  }
  rvWrap.innerHTML = html;
  const more=document.getElementById('pfMore');
  if(more){ more.addEventListener('click', ()=>{ rvShown += PER_PAGE; renderReviews(mine); }); }
}

(async()=>{
  render();
  try {
    const auth = await initAuth();
    if (auth?.user) {
      Object.assign(state, {
        signedIn: true, did: auth.user.did, handle: auth.user.handle,
        displayName: auth.user.display_name || auth.user.handle, avatar: auth.user.avatar_url,
      });
    }
  } catch(e) { console.warn('profile: auth check failed', e); }
  render();
  try { await loadReviews(); } catch(e){ console.warn('profile: loadReviews failed', e); }
  render();
})();
</script>
