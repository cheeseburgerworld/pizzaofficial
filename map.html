<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map — PIZZA⚡OFFICIAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      background: #0d0800; color: #FFFFFF;
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 1000;
      background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,.03) 3px, rgba(0,0,0,.03) 4px);
    }

    /* NAV */
    .nav {
      height: 54px; background: #0d0800;
      border-bottom: 1px solid rgba(255,184,0,.1);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; flex-shrink: 0; z-index: 50; position: relative;
    }
    .nav-logo { font-size: 14px; font-weight: 700; color: #FFFFFF; text-decoration: none; }
    .nav-logo .r { color: #FF3B30; }
    .nav-links { display: flex; gap: 2px; }
    .nav-link {
      font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: #8A7A60; text-decoration: none; padding: 6px 10px; transition: color .15s;
    }
    .nav-link:hover { color: #FFB800; }
    .nav-link.active { color: #FFB800; }

    /* MAP FILLS REMAINING HEIGHT */
    #map {
      flex: 1;
      background: #1a1000;
    }

    /* Override Leaflet defaults for dark theme */
    .leaflet-container {
      background: #1a1000;
      font-family: 'IBM Plex Mono', monospace;
    }
    .leaflet-tile-pane { filter: brightness(.7) saturate(.6) hue-rotate(15deg); }
    .leaflet-control-zoom a {
      background: #1a1000 !important; color: #C8BFA8 !important;
      border-color: rgba(255,184,0,.2) !important;
      font-family: 'IBM Plex Mono', monospace !important;
    }
    .leaflet-control-zoom a:hover { background: #221808 !important; color: #FFB800 !important; }
    .leaflet-control-attribution {
      background: rgba(13,8,0,.8) !important; color: #8A7A60 !important;
      font-size: 9px;
    }
    .leaflet-control-attribution a { color: #8A7A60 !important; }

    /* CUSTOM MARKERS */
    .pizza-marker {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; cursor: pointer;
      border: 2px solid rgba(255,184,0,.4);
      transition: transform .15s, border-color .15s;
      box-shadow: 0 2px 8px rgba(0,0,0,.5);
    }
    .pizza-marker.r3 { background: #221808; border-color: #FFB800; }
    .pizza-marker.r2 { background: #1c1408; border-color: rgba(255,184,0,.5); }
    .pizza-marker.r1 { background: #181008; border-color: rgba(255,184,0,.25); }
    .pizza-marker.r0 { background: #181008; border-color: rgba(255,255,255,.15); }
    .pizza-marker:hover { transform: scale(1.2); border-color: #FFB800; }

    /* REVIEW DRAWER */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.6); z-index: 400;
    }
    .overlay.open { display: block; }

    .drawer {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #141008; border-top: 1px solid rgba(255,184,0,.15);
      z-index: 500; max-height: 85vh; overflow-y: auto;
      transform: translateY(100%);
      transition: transform .28s cubic-bezier(.4,0,.2,1);
    }
    .drawer.open { transform: translateY(0); }

    @media (min-width: 640px) {
      .drawer {
        left: auto; top: 54px; bottom: 0; right: 0; width: 380px;
        max-height: calc(100vh - 54px); border-top: none;
        border-left: 1px solid rgba(255,184,0,.15);
        transform: translateX(100%);
      }
      .drawer.open { transform: translateX(0); }
    }

    .drawer-handle {
      width: 36px; height: 4px; background: rgba(255,184,0,.2);
      border-radius: 2px; margin: 12px auto 0;
    }
    @media (min-width: 640px) { .drawer-handle { display: none; } }

    .drawer-img {
      width: 100%; aspect-ratio: 16/9; background: #0d0800;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .drawer-img img { width: 100%; height: 100%; object-fit: cover; }
    .drawer-placeholder { font-size: 48px; opacity: .15; }

    .drawer-body { padding: 18px 20px 28px; }

    .d-rating { font-size: 16px; margin-bottom: 6px; }
    .d-rating-lbl { font-size: 12px; font-weight: 700; color: #FFB800; }

    .d-name { font-size: 20px; font-weight: 700; color: #FFFFFF; margin-bottom: 10px; line-height: 1.2; }

    .d-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .d-tag {
      font-size: 9px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; padding: 3px 9px;
      border: 1px solid rgba(255,184,0,.2); color: #C8BFA8;
    }
    .d-tag.hi { border-color: #FFB800; color: #FFB800; }
    .d-price-tag { color: #C8BFA8; border-color: rgba(255,255,255,.15); }

    .d-hr { border: none; border-top: 1px solid rgba(255,255,255,.06); margin: 12px 0; }

    .d-notes { font-size: 13px; color: #FFFFFF; line-height: 1.75; margin-bottom: 16px; }

    .d-reviewer {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    }
    .d-av {
      width: 30px; height: 30px; border-radius: 50%;
      background: #1c1408; border: 1px solid rgba(255,184,0,.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #8A7A60; flex-shrink: 0;
    }
    .d-reviewer-handle { font-size: 12px; font-weight: 700; color: #C8BFA8; }
    .d-reviewer-date { font-size: 11px; color: #8A7A60; margin-left: auto; }

    .d-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .d-btn {
      display: inline-block; font-family: inherit; font-size: 11px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      padding: 9px 18px; text-decoration: none; cursor: pointer;
      transition: all .15s; border: none; white-space: nowrap;
    }
    .d-btn-gold { background: #FFB800; color: #0d0800; }
    .d-btn-gold:hover { background: #CC9200; }
    .d-btn-outline { background: transparent; color: #C8BFA8; border: 1px solid rgba(255,255,255,.15); }
    .d-btn-outline:hover { border-color: #C8BFA8; color: #FFFFFF; }

    /* STATS BAR */
    .map-stats {
      position: absolute; top: 68px; left: 12px;
      background: rgba(13,8,0,.9); border: 1px solid rgba(255,184,0,.2);
      padding: 8px 14px; z-index: 200; backdrop-filter: blur(8px);
      font-size: 11px; font-weight: 700; color: #C8BFA8;
      display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    }
    .map-stats .live-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #4ABA5A;
      animation: pulse 2s ease-in-out infinite; flex-shrink: 0;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(74,186,90,.5); }
      50%      { box-shadow: 0 0 0 5px rgba(74,186,90,0); }
    }

    /* NO GEO NOTICE */
    .no-geo {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center; z-index: 200;
      background: rgba(13,8,0,.9); border: 1px solid rgba(255,184,0,.2);
      padding: 24px 28px; max-width: 320px;
    }
    .no-geo-title { font-size: 14px; font-weight: 700; color: #FFB800; margin-bottom: 8px; }
    .no-geo-sub { font-size: 12px; color: #C8BFA8; line-height: 1.65; }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="/" class="nav-logo">PIZZA<span class="r">⚡</span>OFFICIAL</a>
    <div class="nav-links">
      <a href="/database.html" class="nav-link">List</a>
      <a href="/map.html" class="nav-link active">Map</a>
      <a href="/stats.html" class="nav-link">Stats</a>
    </div>
  </nav>

  <div id="map"></div>

  <!-- Stats bar -->
  <div class="map-stats" id="mapStats" style="display:none">
    <div class="live-dot"></div>
    <span id="statsText">Loading…</span>
  </div>

  <!-- Overlay + Drawer -->
  <div class="overlay" id="overlay" onclick="closeDrawer()"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-handle"></div>
    <div class="drawer-img" id="dImg"></div>
    <div class="drawer-body">
      <div class="d-rating" id="dRating"></div>
      <div class="d-name"   id="dName"></div>
      <div class="d-tags"   id="dTags"></div>
      <hr class="d-hr">
      <div class="d-notes"    id="dNotes"></div>
      <div class="d-reviewer" id="dReviewer"></div>
      <div class="d-actions"  id="dActions"></div>
    </div>
  </div>

  <script type="module">
    const RATINGS = {
      3: { s: '⭐⭐⭐', l: 'Legendary' },
      2: { s: '⭐⭐',  l: 'Worth a Trip' },
      1: { s: '⭐',    l: 'Solid' },
      0: { s: 'ㄨ',    l: 'Skip It' },
    };
    const BSKY = 'https://bsky.app';

    // Dark tile layer — CartoDB Dark Matter
    const map = L.map('map', {
      center: [30, 0], zoom: 2,
      zoomControl: true,
    });

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '© <a href="https://carto.com">CARTO</a> © <a href="https://openstreetmap.org">OpenStreetMap</a>',
      subdomains: 'abcd', maxZoom: 19,
    }).addTo(map);

    async function loadReviews() {
      const { getDb } = await import('/auth.js');
      const db = await getDb();

      const { data: reviews, error } = await db
        .from('pizza_reviews')
        .select('id, name, location, city, rating, style, experience, price, notes, image_url, created_at, bluesky_uri, lat, lng, users!pizza_reviews_contributor_did_fkey(handle)')
        .eq('status', 'approved')
        .not('lat', 'is', null)
        .not('lng', 'is', null);

      if (error) { console.error(error); return []; }
      return reviews || [];
    }

    function makeMarker(r) {
      const html = `<div class="pizza-marker r${r.rating}">🍕</div>`;
      const icon = L.divIcon({
        html, className: '', iconSize: [32, 32], iconAnchor: [16, 16],
      });
      return L.marker([r.lat, r.lng], { icon });
    }

    function openDrawer(r) {
      const rt = RATINGS[r.rating] || RATINGS[1];
      const handle = r.users?.handle || 'contributor';
      const date = new Date(r.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

      // Image
      const dImg = document.getElementById('dImg');
      dImg.innerHTML = r.image_url
        ? `<img src="${r.image_url}" alt="${r.name}">`
        : `<div class="drawer-placeholder">🍕</div>`;

      document.getElementById('dRating').innerHTML =
        `${rt.s} <span class="d-rating-lbl">${rt.l}</span>`;
      document.getElementById('dName').textContent = r.name;

      const tags = [
        { t: r.location, hi: false },
        { t: r.style, hi: true },
        r.experience ? { t: r.experience, hi: false } : null,
        r.price      ? { t: r.price, hi: false, cls: 'd-price-tag' } : null,
      ].filter(Boolean);
      document.getElementById('dTags').innerHTML =
        tags.map(({ t, hi, cls }) =>
          `<span class="d-tag ${hi ? 'hi' : ''} ${cls || ''}">${t}</span>`
        ).join('');

      document.getElementById('dNotes').textContent = r.notes || '';

      document.getElementById('dReviewer').innerHTML = `
        <div class="d-av">${handle[0].toUpperCase()}</div>
        <div class="d-reviewer-handle">@${handle}</div>
        <div class="d-reviewer-date">${date}</div>`;

      let actions = '<a href="/database.html" class="d-btn d-btn-outline">All reviews</a>';
      if (r.bluesky_uri) {
        const parts = r.bluesky_uri.split('/');
        const bskyUrl = `${BSKY}/profile/${handle}/post/${parts[parts.length-1]}`;
        actions = `<a href="${bskyUrl}" target="_blank" rel="noopener" class="d-btn d-btn-gold">Discuss on Bluesky ↗</a>` + actions;
      }
      document.getElementById('dActions').innerHTML = actions;

      document.getElementById('overlay').classList.add('open');
      document.getElementById('drawer').classList.add('open');
    }

    window.closeDrawer = function() {
      document.getElementById('overlay').classList.remove('open');
      document.getElementById('drawer').classList.remove('open');
    };

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

    async function init() {
      // Auth (non-blocking)
      try {
        const { initAuth } = await import('/auth.js');
        const auth = await initAuth();
        if (auth?.user) {
          const nav = document.querySelector('.nav-links');
          const a = document.createElement('a');
          a.href = '/profile.html'; a.className = 'nav-link';
          a.textContent = '@' + auth.user.handle;
          nav.appendChild(a);
        }
      } catch {}

      const reviews = await loadReviews();

      if (!reviews.length) {
        const noGeo = document.createElement('div');
        noGeo.className = 'no-geo';
        noGeo.innerHTML = `
          <div class="no-geo-title">No mapped reviews yet</div>
          <div class="no-geo-sub">Reviews get placed on the map when they're approved.
          Coordinates are geocoded automatically from the city + region you submit.</div>`;
        document.getElementById('map').appendChild(noGeo);
        return;
      }

      // Add markers
      const markers = [];
      reviews.forEach(r => {
        const m = makeMarker(r);
        m.on('click', () => openDrawer(r));
        m.addTo(map);
        markers.push(m);
      });

      // Fit bounds to all markers
      if (markers.length > 1) {
        const group = L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(.15), { maxZoom: 12 });
      } else if (markers.length === 1) {
        map.setView([reviews[0].lat, reviews[0].lng], 13);
      }

      // Stats bar
      const cities = new Set(reviews.map(r => r.city || r.location?.split(',')[0]).filter(Boolean));
      document.getElementById('statsText').textContent =
        `${reviews.length} review${reviews.length !== 1 ? 's' : ''} · ${cities.size} city${cities.size !== 1 ? 'ies' : 'y'}`;
      document.getElementById('mapStats').style.display = 'flex';
    }

    init();
  </script>
</body>
</html>
