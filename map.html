<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map — Pizza Official</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%95%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pizza-theme.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  a.logo { text-decoration:none; } a.tab { text-decoration:none; display:inline-block; }
  html, body { height:auto; min-height:100%; }
  body { overflow-y:auto; }

  /* ── MAP VIEW ── */
  #mapView { height:calc(100vh - 55px); }
  .map-layout { display:flex; height:100%; position:relative; }
  #map { flex:1; background:var(--ground); }
  #map .leaflet-tile-pane { filter:brightness(1.7) contrast(1.05) saturate(1.1); }

  .panel { width:380px; flex-shrink:0; background:var(--surface); border-left:1px solid var(--border); overflow-y:auto; display:flex; flex-direction:column; }
  .panel-empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 30px; }
  .pe-bolt { font-size:34px; margin-bottom:16px; font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif; opacity:0.9; }
  .pe-title { font-family:var(--font-display); font-size:26px; letter-spacing:1px; color:var(--text); margin-bottom:10px; }
  .pe-sub { font-size:13px; color:var(--text-3); line-height:1.6; max-width:240px; }
  .review-backdrop { display:none; }
  .review { display:none; }
  .review.show { display:block; }
  .panel.has-review .panel-empty { display:none; }
  .rv-header { position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:flex-end; height:30px; padding:0 9px; background:var(--inset); border-bottom:1px solid var(--raised); }
  .rv-close { width:22px; height:22px; border:none; background:none; color:#fff; font-size:20px; font-weight:700; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .rv-close:hover { color:var(--red); }
  .rv-namerow { display:flex; align-items:center; gap:10px; }
  .rv-nav { display:none; flex-shrink:0; }
  .review.multi .rv-nav { display:flex; }
  .rv-arrow { width:32px; height:32px; border:none; border-radius:50%; background:var(--red); color:var(--text-on-red); font-size:19px; font-weight:700; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .12s; }
  .rv-arrow:hover { background:var(--red-hover); }
  .rv-arrow:active { transform:translateY(1px); }
  .rv-count { display:none; font-size:11px; color:var(--text-3); letter-spacing:1px; margin:5px 0 0; }
  .review.multi .rv-count { display:block; }
  .rv-photo { width:100%; height:240px; background:var(--inset); background-size:contain; background-repeat:no-repeat; background-position:center; border-bottom:1px solid var(--border); }
  .rv-head { padding:22px 26px 16px; border-bottom:1px solid var(--border); }
  .rv-name { font-family:var(--font-display); font-size:34px; letter-spacing:1px; color:var(--text); line-height:1; flex:1; min-width:0; }
  .rv-loc { font-size:12px; color:var(--text-2); margin-top:5px; }
  .rv-meta { display:flex; gap:12px; margin-top:14px; align-items:center; flex-wrap:wrap; }
  .rv-rating { font-size:15px; display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:4px; }
  .rv-rating .lab { font-family:var(--font-display); font-size:15px; letter-spacing:1px; }
  .rv-tier { font-size:14px; color:var(--text); font-weight:600; }
  .rv-style { font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--text-2); border:1px solid var(--border); padding:3px 8px; }
  .rv-bucket { padding:16px 26px; border-bottom:1px solid var(--raised); }
  .rv-bucket-label { font-family:var(--font-display); font-size:15px; letter-spacing:1.5px; color:var(--text); margin-bottom:7px; }
  .rv-bucket-text { font-size:13px; color:var(--text-2); line-height:1.6; }
  .rv-by { padding:16px 26px 3px; font-size:13px; color:var(--text-2); letter-spacing:0.3px; }
  .rv-by b { color:var(--text); font-weight:600; }
  .rv-date { display:block; padding:0 26px 16px; font-size:12px; color:var(--text-3); letter-spacing:0.5px; }
  .rv-bsky { display:block; margin:4px 26px 22px; padding:11px 14px; background:var(--bsky); color:#fff; text-decoration:none; font-size:13px; text-align:center; font-weight:600; }
  .rv-bsky:hover { background:var(--bsky-hover); }
  .cb-pin { border-radius:50%; border:3px solid var(--ground); box-shadow:0 0 0 1px rgba(0,0,0,0.6), 0 1px 6px rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; box-sizing:border-box; }
  .rv-name-bolt { color:var(--rate-legendary); font-size:0.7em; vertical-align:middle; margin-left:6px; }
  .pin-skip { background:var(--rate-skip-fill); width:14px; height:14px; }
  .pin-solid { background:var(--rate-solid); width:18px; height:18px; }
  .pin-trip { background:var(--rate-worth); width:22px; height:22px; }
  .pin-legendary { background:var(--rate-legendary); width:30px; height:30px; box-shadow:0 0 0 1px rgba(0,0,0,0.6), 0 0 12px rgba(255,214,10,0.4); }
  .pin-legendary .pin-bolt { color:var(--inset); font-size:13px; font-weight:700; line-height:1; }
  .pin-count { position:absolute; top:-5px; right:-5px; min-width:15px; height:15px; padding:0 3px; border-radius:8px; background:var(--red); color:var(--text-on-red); font-size:10px; font-weight:700; line-height:15px; text-align:center; border:1.5px solid var(--ground); }
  .leaflet-popup-content-wrapper { background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:0; font-family:var(--font-body); }
  .leaflet-popup-content { margin:10px 14px; }
  .leaflet-popup-tip { background:var(--surface); }
  .pop-name { font-family:var(--font-display); font-size:18px; letter-spacing:1px; color:var(--text); text-align:center; }
  .pop-rating { font-size:12px; color:var(--text); margin-top:2px; text-align:center; }
  .pop-price { font-size:12px; color:var(--text); margin-top:2px; letter-spacing:1px; text-align:center; }

  /* ── MAP FILTER + LEGEND ── */
  .map-filter { position:absolute; top:14px; left:14px; z-index:1100; background:rgba(13,8,0,0.96); border:1px solid var(--border); padding:9px 12px; display:flex; align-items:center; gap:9px; }
  .mf-label { font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--text-3); }
  #citySelect { background:var(--inset); border:1px solid var(--border-interactive); color:var(--text); font-family:var(--font-body); font-size:13px; padding:6px 9px; cursor:pointer; }
  #citySelect:focus { outline:none; border-color:var(--red); }
  .legend { position:absolute; bottom:18px; left:18px; z-index:1100; background:rgba(13,8,0,0.94); border:1px solid var(--border); padding:11px 13px; pointer-events:none; }
  .legend-title { font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-3); margin-bottom:8px; }
  .legend-row { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--text-2); margin-bottom:5px; }
  .legend-row:last-child { margin-bottom:0; }
  .legend-dot { width:12px; height:12px; border-radius:50%; flex-shrink:0; }

  .site-footer { border-top:1px solid var(--border); background:var(--surface); margin-top:40px; padding:22px 20px; }
  .footer-inner { max-width:1100px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .footer-links { display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .footer-links a { font-family:var(--font-body); font-size:12px; letter-spacing:0.5px; color:var(--text-2); text-decoration:none; }
  .footer-links a:hover { color:var(--red); }
  .footer-copy { font-size:11px; color:var(--text-3); }

  @media (max-width:760px) {
    .nav { gap:12px; } .nav-left { gap:14px; min-width:0; flex:1; }
    .tabs { overflow-x:auto; -webkit-overflow-scrolling:touch; gap:2px; scrollbar-width:none; }
    .tabs::-webkit-scrollbar { display:none; }
    .tab { flex:0 0 auto; white-space:nowrap; padding:8px 11px; }
    .footer-inner { flex-direction:column; align-items:flex-start; gap:14px; }
    .map-layout { flex-direction:column; }
    #map { flex:1; min-height:0; }
    #mapView { height:calc(100vh - 130px); display:flex; flex-direction:column; }
    .map-filter { top:14px; left:14px; bottom:auto; right:auto; transform:none; }
    .legend { display:none; }
    .panel { width:auto; border:none; background:transparent; display:contents; }
    .panel-empty { display:none; }
    .review-backdrop { display:none; position:fixed; inset:0; background:rgba(8,6,3,0.82); z-index:1250; }
    .review-backdrop.show { display:block; }
    .review.show {
      position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
      width:calc(100% - 28px); max-width:440px; max-height:82vh; overflow-y:auto;
      background:var(--surface); border:1px solid var(--text); box-shadow:0 14px 44px rgba(0,0,0,0.6);
      z-index:1300;
    }
    .review.show::after {
      content:''; position:sticky; bottom:0; left:0; display:block; height:30px; margin-top:-30px;
      background:linear-gradient(to bottom, rgba(13,8,0,0), var(--surface)); pointer-events:none;
    }
    body.review-open .map-filter, body.review-open .leaflet-control-zoom { display:none !important; }
    .rv-name { font-size:28px; }
  }
</style>
</head>
<body>
<div class="nav">
  <div class="nav-left">
    <a class="logo" href="/">PIZZA<span class="bolt">⚡</span>OFFICIAL</a>
    <div class="tabs">
      <a class="tab" href="/database.html">Database</a>
      <a class="tab active" href="/map.html">Map</a>
      <a class="tab" href="/submit.html">Post a Review</a>
    </div>
  </div>
  <a href="/profile.html" style="text-decoration:none;"><div class="nav-id" id="navId"><span class="dot out"></span>Not signed in</div></a>
</div>

<div id="mapView">
  <div class="map-layout">
    <div id="map"></div>
    <div class="map-filter">
      <label class="mf-label">City</label>
      <select id="citySelect" onchange="filterCity(this.value)"></select>
    </div>
    <div class="legend">
      <div class="legend-title">Rating</div>
      <div class="legend-row"><span class="legend-dot" style="background:var(--rate-legendary)"></span>Legendary</div>
      <div class="legend-row"><span class="legend-dot" style="background:var(--rate-worth)"></span>Worth A Trip</div>
      <div class="legend-row"><span class="legend-dot" style="background:var(--rate-solid)"></span>Solid</div>
      <div class="legend-row"><span class="legend-dot" style="background:var(--rate-skip-fill)"></span>Skip It</div>
    </div>
    <div class="panel" id="panel">
      <div class="panel-empty" id="panelEmpty">
        <div class="pe-bolt">🍕</div>
        <div class="pe-title" id="peTitle">Loading pizza…</div>
        <div class="pe-sub" id="peSub">Pulling the latest reviews.</div>
      </div>
      <div class="review" id="review">
        <div class="rv-header"><button class="rv-close" onclick="closeReview()" aria-label="Close">×</button></div>
        <div class="rv-photo" id="rPhoto"></div>
        <div class="rv-head">
          <div class="rv-namerow">
            <div class="rv-name" id="rName"></div>
            <div class="rv-nav"><button class="rv-arrow" id="rNext" onclick="stackStep(1)" aria-label="Next review">›</button></div>
          </div>
          <div class="rv-count" id="rStackCount"></div>
          <div class="rv-loc" id="rLoc"></div>
          <div class="rv-meta">
            <span class="rv-rating"><span id="rGlyph"></span><span class="lab" id="rLabel"></span></span>
            <span class="rv-tier" id="rTier"></span>
            <span class="rv-style" id="rStyle"></span>
          </div>
        </div>
        <div class="rv-bucket"><div class="rv-bucket-label">The Pizza</div><div class="rv-bucket-text" id="rPizza"></div></div>
        <div class="rv-bucket"><div class="rv-bucket-label">The Take</div><div class="rv-bucket-text" id="rValue"></div></div>
        <div class="rv-by">Reviewed by <b id="rBy"></b></div>
        <div class="rv-date" id="rDate"></div>
        <a class="rv-bsky" id="rBsky" href="#" target="_blank" rel="noopener" style="display:none;">View &amp; discuss on Bluesky →</a>
      </div>
    </div>
    <div class="review-backdrop" id="reviewBackdrop" onclick="closeReview()"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="pizza-config.js"></script>
<script type="module">
  import '/auth.js';
  (function () {
    const el = document.getElementById('navId');
    function paint() {
      const st = window.__pzof_state;
      el.innerHTML = st?.signedIn
        ? '<span class="dot"></span>@' + st.handle
        : '<span class="dot out"></span>Not signed in';
    }
    paint();
    window.addEventListener('pzof-auth', paint);
  })();
</script>
<script>
  const map = L.map('map',{zoomControl:false});
  L.control.zoom({ position:'topright' }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO',subdomains:'abcd',maxZoom:19}).addTo(map);

  let stackReviews = [];
  let stackIndex = 0;
  function showReview(r){
    stackReviews = reviews.filter(x => x.name===r.name && x.loc===r.loc)
      .sort((a,b)=>{
        const ta=a.createdAt?new Date(a.createdAt).getTime():0;
        const tb=b.createdAt?new Date(b.createdAt).getTime():0;
        return tb-ta;
      });
    if(!stackReviews.length) stackReviews=[r];
    const idx = stackReviews.findIndex(x=>x===r);
    stackIndex = idx>=0 ? idx : 0;
    document.getElementById('review').classList.add('show');
    document.getElementById('panel').classList.add('has-review');
    document.body.classList.add('review-open');
    document.getElementById('reviewBackdrop').classList.add('show');
    const pnl=document.getElementById('panel'); if(pnl) pnl.scrollTop=0;
    paintReview();
  }
  function stackStep(delta){
    stackIndex = (stackIndex + delta + stackReviews.length) % stackReviews.length;
    paintReview();
  }
  function paintReview(){
    const r = stackReviews[stackIndex];
    const rt=RATING[r.rating];
    const card=document.getElementById('review');
    if(stackReviews.length>1){
      card.classList.add('multi');
      document.getElementById('rStackCount').textContent=(stackIndex+1)+' of '+stackReviews.length+' reviews';
    } else {
      card.classList.remove('multi');
    }
    const isLeg = r.legendaryCanonical === true;
    rName.innerHTML = r.name + (isLeg?'<span class="rv-name-bolt">⚡</span>':'');
    rLoc.textContent=r.loc; rGlyph.textContent=rt.glyph; rLabel.textContent=rt.label;
    const chip=document.querySelector('.rv-rating');
    if(chip){ chip.style.background=rt.color; chip.style.color=(rt.text||'var(--inset)'); }
    const lab=document.getElementById('rLabel'); if(lab) lab.style.color=(rt.text||'var(--inset)');
    rTier.textContent=r.tier; rStyle.textContent=r.style; rPizza.textContent=r.pizza;
    rValue.textContent=r.value; rBy.textContent=r.by;
    const rd=document.getElementById('rDate');
    if(rd) rd.textContent=(typeof shortDate==='function')?shortDate(r.createdAt):'';
    const bsky=document.getElementById('rBsky');
    const url=(typeof bskyWebUrl==='function')?bskyWebUrl(r.bskyUri, r.by):'';
    if(bsky){ if(url){ bsky.href=url; bsky.style.display='block'; } else { bsky.style.display='none'; } }
    const ph=document.getElementById('rPhoto');
    if(ph){
      if(r.photoUrl){ ph.style.display='block'; ph.style.backgroundImage="url('"+r.photoUrl+"')"; }
      else { ph.style.display='none'; }
    }
    document.getElementById('review').scrollTop=0;
  }
  const markers=[];
  const RANK_ORDER={skip:0,solid:1,trip:2,legendary:3};
  function buildMarkers(){
    markers.length=0;
    const groups={};
    reviews.forEach(r=>{
      if(r.lat==null || r.lng==null) return;
      const key=r.name+'|'+r.loc;
      (groups[key]=groups[key]||[]).push(r);
    });
    Object.values(groups).forEach(group=>{
      const best=group.reduce((a,b)=>(RANK_ORDER[b.rating]>RANK_ORDER[a.rating]?b:a));
      const rt=RATING[best.rating];
      const canonicalLeg=group.some(r=>r.legendaryCanonical===true);
      const count=group.length;
      const boltHtml = (canonicalLeg) ? '<span class="pin-bolt">⚡</span>' : '';
      const countHtml = count>1 ? '<span class="pin-count">'+count+'</span>' : '';
      const size = best.rating==='legendary'?30:best.rating==='trip'?22:best.rating==='solid'?18:14;
      const icon=L.divIcon({
        className:'',
        html:'<div style="position:relative;">'+
             '<div class="cb-pin '+rt.cls+'">'+boltHtml+'</div>'+countHtml+
             '</div>',
        iconSize:[size,size], iconAnchor:[size/2,size/2]
      });
      const r0=group[0];
      const m=L.marker([r0.lat,r0.lng],{icon}).addTo(map);
      const popName = r0.name + (canonicalLeg?' ⚡':'');
      const popSub = count>1 ? (count+' reviews · best: '+rt.label) : (rt.glyph+' '+rt.label);
      const popPrice = count>1 ? '' : ('<div class="pop-price">'+r0.tier+'</div>');
      m.bindPopup('<div class="pop-name">'+popName+'</div><div class="pop-rating">'+popSub+'</div>'+popPrice);
      m.on('click',()=>{m.openPopup();showReview(r0);});
      markers.push({marker:m, review:r0, group:group});
    });
  }
  function fitAll(){
    if(!markers.length){ map.setView([40.7128,-74.006],11); return; }
    const byCity={};
    markers.forEach(x=>{ const c=x.review.loc; (byCity[c]=byCity[c]||[]).push(x); });
    let topCity=null, topN=0;
    Object.keys(byCity).forEach(c=>{ if(byCity[c].length>topN){ topN=byCity[c].length; topCity=c; } });
    const focusMarkers = topCity ? byCity[topCity] : markers;
    const grp=L.featureGroup(focusMarkers.map(x=>x.marker));
    if(focusMarkers.length===1){
      const r=focusMarkers[0].review; map.setView([r.lat,r.lng],13);
    } else {
      map.fitBounds(grp.getBounds().pad(0.3));
    }
  }
  function closeReview(){
    document.getElementById('review').classList.remove('show');
    document.getElementById('panel').classList.remove('has-review');
    document.getElementById('reviewBackdrop').classList.remove('show');
    document.body.classList.remove('review-open');
    map.closePopup();
  }
  function buildCityDropdown(){
    const cityCounts={};
    reviews.forEach(r=>{ cityCounts[r.loc]=(cityCounts[r.loc]||0)+1; });
    const cities=Object.entries(cityCounts).sort((a,b)=>b[1]-a[1]);
    const sel=document.getElementById('citySelect');
    sel.innerHTML='<option value="all">All cities ('+reviews.length+')</option>'+
      cities.map(([c,n])=>'<option value="'+c+'">'+c+' ('+n+')</option>').join('');
  }
  function filterCity(city){
    const shown=[];
    markers.forEach(x=>{
      const vis = city==='all' || x.review.loc===city;
      if(vis){ x.marker.addTo(map); shown.push(x.marker); } else { map.removeLayer(x.marker); }
    });
    if(shown.length){
      const grp=L.featureGroup(shown);
      map.fitBounds(grp.getBounds().pad(shown.length===1?2:0.25));
    }
  }
  (async()=>{
    await loadReviews();
    buildMarkers();
    buildCityDropdown();
    const peTitle=document.getElementById('peTitle'), peSub=document.getElementById('peSub');
    if(peTitle) peTitle.textContent='Explore the map';
    if(peSub) peSub.textContent='Tap any pin to read its review. Bigger pins are better pizza — the gold one is Legendary.';
    if(!reviews.length){
      map.setView([40.7128,-74.006],11);
      return;
    }
    const qp=new URLSearchParams(location.search);
    if(qp.has('r')){
      const idx=+qp.get('r'); const r=reviews[idx];
      if(r && r.lat!=null && r.lng!=null){ map.setView([r.lat,r.lng],15); showReview(r); }
      else { fitAll(); if(r) showReview(r); }
    }
    else { fitAll(); }
  })();
</script>
