<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pizza Official — Signing in…</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  body { background:#0d0800; color:#F5F0E8; font-family:'IBM Plex Mono',monospace;
         display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
  .msg { text-align:center; }
  .logo { font-family:'Bebas Neue',sans-serif; font-size:34px; letter-spacing:2px; margin-bottom:14px; }
  .bolt { color:#FF3B30; }
  .status { font-size:13px; color:#B09878; }
</style>
</head>
<body>
  <!--
    Under normal operation this file never renders: the /oauth/callback
    edge function (netlify/edge-functions/auth-callback.js) intercepts the
    request, completes the token exchange server-side, and redirects the
    browser straight to its final destination with a session cookie set.
    This page only shows up if that interception didn't happen for some
    reason — worth checking Netlify's function logs if anyone ever sees it.
  -->
  <div class="msg">
    <div class="logo">PIZZA<span class="bolt">⚡</span>OFFICIAL</div>
    <div class="status" id="status">Completing sign in…</div>
  </div>
  <script>
    setTimeout(() => { window.location.replace('/'); }, 2500);
  </script>
</body>
</html>
