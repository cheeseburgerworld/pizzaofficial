[build]
  publish = "."
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

# ── OAuth BFF routes ──────────────────────────────────────────
# New: these run before static files / the functions above, on Deno,
# separate from the existing netlify/functions Lambda directory so
# nothing there (agree, approve, auth-user, submit-review, etc.) is
# touched by this change.
[[edge_functions]]
  path = "/auth/start"
  function = "auth-start"

[[edge_functions]]
  path = "/auth/session"
  function = "auth-session"

[[edge_functions]]
  path = "/auth/proxy"
  function = "auth-proxy"

[[edge_functions]]
  path = "/auth/signout"
  function = "auth-signout"

[[edge_functions]]
  path = "/oauth/callback"
  function = "auth-callback"

# Correct content-type for ATProto OAuth metadata
[[headers]]
  for = "/oauth/client-metadata.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

# Serve lexicons as JSON at their canonical URL —
# e.g. https://official.pizza/lexicons/pizza/official/review.json
[[headers]]
  for = "/lexicons/*"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# NOTE: No catch-all redirect here.
# This is a static site with real files at real paths.
# A /* redirect would break JS module loading.
