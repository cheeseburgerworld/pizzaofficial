<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database — PIZZA⚡OFFICIAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      background: #0d0800; color: #FFFFFF;
      min-height: 100vh;
    }

    /* ── NAV ─────────────────────────────────── */
    .nav {
      height: 52px;
      background: #0d0800;
      
      -webkit-
      border-bottom: 1px solid #3a2400;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; position: sticky; top: 0; z-index: 100;
    }
    .nav-logo { font-size: 14px; font-weight: 700; color: #FFFFFF; text-decoration: none; }
    .nav-logo .bolt { color: #FF3B30; }
    .nav-links { display: flex; align-items: center; gap: 2px; }
    @media (max-width: 580px) { .nav-links { display: none; } }
    .nav-link {
      font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: #C8B090; text-decoration: none; padding: 6px 10px;
      border-radius: 6px; transition: all .15s;
    }
    .nav-link:hover { color: #FFFFFF; background: #241600; }
    .nav-link.active { color: #FFB800; }
    .nav-user-btn {
      font-family: inherit; font-size: 11px; font-weight: 700;
      color: #C8B090; text-decoration: none; padding: 6px 12px;
      border: 1px solid #4a3010; border-radius: 6px;
      transition: all .15s; background: none; cursor: pointer;
    }
    .nav-user-btn:hover { color: #FFFFFF; border-color: #FFB800; }

    /* ── PAGE HEADER ─────────────────────────── */
    .page-header {
      max-width: 1160px; margin: 0 auto;
      padding: 28px 24px 0;
    }
    .header-row {
      display: flex; align-items: flex-end;
      justify-content: space-between; gap: 16px;
      margin-bottom: 20px; flex-wrap: wrap;
    }
    .page-title {
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 700; letter-spacing: -.03em;
      color: #FFFFFF; line-height: 1;
    }
    .live-pill {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 11px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: #30D158;
      background: rgba(48,209,88,.08);
      border: 1px solid rgba(48,209,88,.2);
      border-radius: 100px; padding: 5px 12px;
    }
    .live-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #30D158; flex-shrink: 0;
      animation: livePulse 2s ease-in-out infinite;
    }
    @keyframes livePulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(48,209,88,.5); }
      50%      { box-shadow: 0 0 0 5px rgba(48,209,88,0); }
    }

    /* ── FILTER BAR ──────────────────────────── */
    .filter-bar {
      max-width: 1160px; margin: 0 auto;
      background: #1a1000;
      border: 1px solid #3a2400;
      border-radius: 0;
      margin-left: 24px; margin-right: 24px;
      overflow: hidden; margin-bottom: 24px;
    }
    @media (min-width: 1208px) {
      .filter-bar { margin-left: auto; margin-right: auto; }
    }
    .filter-row {
      display: flex; align-items: center;
      padding: 0 6px;
      overflow-x: auto; scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }
    .filter-row + .filter-row {
      border-top: 1px solid #2E1C00;
    }
    .filter-group-label {
      font-size: 9px; font-weight: 700; letter-spacing: .2em;
      text-transform: uppercase; color: #C8B090;
      padding: 0 10px 0 8px; white-space: nowrap; flex-shrink: 0;
      border-right: 1px solid #2E1C00; margin: 8px 4px 8px 0;
      line-height: 2;
    }
    .f-btn {
      font-family: inherit; font-size: 11px; font-weight: 700;
      letter-spacing: .04em;
      padding: 8px 14px; margin: 5px 2px;
      background: transparent; border: none;
      border-radius: 6px;
      color: #C8B090; cursor: pointer;
      white-space: nowrap;
      transition: all .15s;
    }
    .f-btn:hover { color: #FFFFFF; background: #241600; }
    .f-btn.on {
      color: #FFB800;
      background: rgba(255,184,0,.1);
    }

    /* City select */
    .city-select {
      font-family: inherit; font-size: 11px; font-weight: 700;
      letter-spacing: .04em;
      padding: 7px 12px; margin: 5px 2px;
      background: transparent; color: #C8B090;
      border: none; border-radius: 6px;
      cursor: pointer; outline: none;
      -webkit-appearance: none; appearance: none;
      transition: all .15s;
    }
    .city-select:hover { color: #FFFFFF; background: #241600; }
    .city-select option { background: #1c1508; color: #FFFFFF; }

    /* ── TOOLBAR ─────────────────────────────── */
    .toolbar {
      max-width: 1160px; margin: 0 auto;
      padding: 0 24px;
      display: flex; align-items: center;
      justify-content: space-between; gap: 10px;
      margin-bottom: 16px; flex-wrap: wrap;
    }
    .result-count { font-size: 12px; color: #9A7850; }
    .sort-group { display: flex; gap: 4px; }
    .sort-btn {
      font-family: inherit; font-size: 11px; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase;
      padding: 6px 12px;
      background: transparent;
      border: 1px solid #3a2400;
      border-radius: 6px; color: #C8B090;
      cursor: pointer; transition: all .15s;
    }
    .sort-btn:hover { border-color: #5a3a10; color: #E0D5C5; }
    .sort-btn.on { border-color: #FFB800; color: #FFB800; background: rgba(255,184,0,.08); }

    /* ── CONTENT ─────────────────────────────── */
    .content {
      max-width: 1160px; margin: 0 auto;
      padding: 0 24px 56px;
    }

    /* City heading */
    .city-section { margin-bottom: 32px; }
    .city-heading {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 14px;
    }
    .city-name {
      font-size: 11px; font-weight: 700; letter-spacing: .14em;
      text-transform: uppercase; color: #C8B090;
    }
    .city-line {
      flex: 1; height: 1px;
      background: #2E1C00;
    }
    .city-count { font-size: 10px; color: #9A7850; }

    /* ── GRID ────────────────────────────────── */
    .grid {
      display: grid; gap: 14px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 560px)  { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 860px)  { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1160px) { .grid { grid-template-columns: repeat(4, 1fr); } }

    /* ── CARD ────────────────────────────────── */
    .card {
      background: #1a1000;
      border: 1px solid #3a2400;
      border-radius: 10px;
      cursor: pointer;
      display: flex; flex-direction: column;
      overflow: hidden;
      transition: border-color .2s, box-shadow .2s, transform .2s;
      position: relative;
    }
    .card:hover {
      border-color: #FFB800;
      box-shadow: 0 4px 24px rgba(0,0,0,.4);
      transform: translateY(-2px);
    }
    .card:active { transform: translateY(0); }

    /* Card with image */
    .card-img {
      width: 100%; aspect-ratio: 16/10;
      background: #241600; overflow: hidden; flex-shrink: 0;
      position: relative;
    }
    .card-img img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform .4s ease;
    }
    .card:hover .card-img img { transform: scale(1.04); }

    .rating-badge {
      position: absolute; bottom: 10px; left: 10px;
      font-size: 11px; font-weight: 700;
      background: rgba(10,6,0,.88);
      border: 1px solid rgba(255,184,0,.2);
      border-radius: 6px;
      padding: 4px 10px;
      backdrop-filter: blur(8px);
      letter-spacing: .03em;
    }

    /* No-image card — left stripe */
    .card.no-img { border-left-width: 2px; }
    .card.no-img.r3 { border-left-color: #FFB800; }
    .card.no-img.r2 { border-left-color: #CC9200; }
    .card.no-img.r1 { border-left-color: rgba(255,184,0,.3); }
    .card.no-img.r0 { border-left-color: #3a2400; }

    /* Card body */
    .card-body {
      padding: 14px 16px 12px;
      display: flex; flex-direction: column; flex: 1; gap: 0;
    }
    .card-inline-rating {
      font-size: 12px; font-weight: 700; color: #C8B090;
      margin-bottom: 7px; line-height: 1;
      display: flex; align-items: center; gap: 7px;
    }
    .card-inline-lbl {
      font-size: 9px; letter-spacing: .1em;
      text-transform: uppercase; color: #9A7850;
    }
    .card-name {
      font-size: 14px; font-weight: 700; color: #FFFFFF;
      line-height: 1.3; margin-bottom: 6px;
    }
    .card-meta {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: #C8B090;
      margin-bottom: 10px; flex-wrap: wrap;
    }
    .meta-sep { color: #9A7850; }
    .tag {
      font-size: 9px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: #C8B090;
      background: #241600;
      border: 1px solid #3a2400;
      border-radius: 4px; padding: 2px 7px;
    }
    .tag.style { color: #E0D5C5; }
    .tag.price { color: #FFB800; background: rgba(255,184,0,.08); border-color: rgba(255,184,0,.25); }

    .card-excerpt {
      font-size: 12px; color: #E0D5C5; line-height: 1.7; flex: 1;
      display: -webkit-box; -webkit-line-clamp: 3;
      -webkit-box-orient: vertical; overflow: hidden;
      margin-bottom: 12px;
    }
    .card-footer {
      display: flex; align-items: center;
      justify-content: space-between; gap: 6px;
      padding-top: 10px;
      border-top: 1px solid #2E1C00;
      margin-top: auto;
    }
    .card-reviewer { font-size: 10px; color: #9A7850; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-discuss {
      font-size: 10px; color: #C8B090; text-decoration: none;
      font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
      padding: 3px 8px;
      border: 1px solid #3a2400;
      border-radius: 4px;
      transition: all .15s; flex-shrink: 0;
    }
    .card-discuss:hover { color: #FFB800; border-color: #FFB800; }

    /* ── SKELETON ────────────────────────────── */
    .skel {
      background: #1a1000; border: 1px solid #3a2400;
      border-radius: 10px; height: 260px;
      animation: shimmer 1.8s ease-in-out infinite;
    }
    @keyframes shimmer { 0%,100%{opacity:.4} 50%{opacity:.7} }

    /* ── EMPTY ───────────────────────────────── */
    .empty {
      grid-column: 1/-1; text-align: center;
      padding: 72px 20px;
    }
    .empty-icon { font-size: 40px; margin-bottom: 16px; opacity: .25; }
    .empty-title { font-size: 15px; font-weight: 700; color: #E0D5C5; margin-bottom: 8px; }
    .empty-sub { font-size: 13px; color: #C8B090; line-height: 1.7; }
    .empty-sub a { color: #FFB800; text-decoration: none; }

    /* ── DRAWER ──────────────────────────────── */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.65); z-index: 200;
      backdrop-filter: blur(4px);
    }
    .overlay.open { display: block; }

    .drawer {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #1a1000;
      border-top: 1px solid #2E1C00;
      border-radius: 16px 16px 0 0;
      z-index: 300; max-height: 90vh; overflow-y: auto;
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
    }
    .drawer.open { transform: translateY(0); }
    @media (min-width: 680px) {
      .drawer {
        left: auto; top: 0; bottom: 0; right: 0;
        width: min(480px, 90vw); max-height: 100vh;
        border-top: none; border-radius: 0;
        border-left: 1px solid #3a2400;
        transform: translateX(100%);
      }
      .drawer.open { transform: translateX(0); }
    }

    .drawer-handle {
      width: 36px; height: 4px;
      background: #241600;
      border-radius: 2px; margin: 14px auto 0;
    }
    @media (min-width: 680px) { .drawer-handle { display: none; } }

    .drawer-img {
      width: 100%; aspect-ratio: 16/9;
      background: #241600; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .drawer-img img { width: 100%; height: 100%; object-fit: cover; }
    .drawer-placeholder { font-size: 52px; opacity: .1; }

    .drawer-body { padding: 20px 22px 36px; }

    .d-head {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 10px;
      margin-bottom: 4px;
    }
    .d-name { font-size: 20px; font-weight: 700; color: #FFFFFF; line-height: 1.2; flex: 1; }
    .d-close {
      width: 32px; height: 32px;
      background: #241600; border: 1px solid #3a2400;
      border-radius: 8px;
      color: #C8B090; font-size: 18px;
      cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      flex-shrink: 0; transition: all .15s; font-family: inherit;
    }
    .d-close:hover { border-color: #FF3B30; color: #FF3B30; }

    .d-rating { font-size: 17px; margin-bottom: 12px; }
    .d-rating-lbl { font-size: 12px; font-weight: 700; color: #FFB800; }

    .d-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .d-tag {
      font-size: 10px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: #E0D5C5;
      background: #241600;
      border: 1px solid #3a2400;
      border-radius: 5px; padding: 4px 10px;
    }
    .d-tag.hi { border-color: rgba(255,184,0,.4); color: #FFB800; background: rgba(255,184,0,.08); }
    .d-tag.price { color: #FFB800; background: rgba(255,184,0,.06); border-color: rgba(255,184,0,.25); }

    .d-hr { border: none; border-top: 1px solid #2E1C00; margin: 14px 0; }

    .d-notes { font-size: 14px; color: #FFFFFF; line-height: 1.8; margin-bottom: 18px; }

    .d-reviewer {
      display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
    }
    .d-av {
      width: 32px; height: 32px; border-radius: 50%;
      background: #241600; border: 1px solid #3a2400;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #C8B090; flex-shrink: 0;
    }
    .d-reviewer-handle { font-size: 12px; font-weight: 700; color: #E0D5C5; }
    .d-reviewer-badge {
      font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      padding: 1px 6px; border-radius: 3px;
      background: rgba(255,184,0,.1); color: #FFB800;
    }
    .d-reviewer-date { font-size: 11px; color: #C8B090; margin-left: auto; }

    .d-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .d-btn {
      display: inline-block; font-family: inherit; font-size: 12px; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase;
      padding: 10px 18px; border-radius: 8px;
      text-decoration: none; cursor: pointer;
      transition: all .15s; border: none;
    }
    .d-btn-gold { background: #FFB800; color: #0d0800; }
    .d-btn-gold:hover { background: #CC9200; transform: translateY(-1px); }
    .d-btn-outline {
      background: transparent; color: #E0D5C5;
      border: 1px solid #4a3010;
    }
    .d-btn-outline:hover { color: #FFFFFF; border-color: #FFB800; }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="/" class="nav-logo">PIZZA<span class="bolt">⚡</span>OFFICIAL</a>
    <div class="nav-links">
      <a href="/database.html" class="nav-link active">Database</a>
      <a href="/map.html" class="nav-link">Map</a>
      <a href="/stats.html" class="nav-link">Stats</a>
      <a href="/format.html" class="nav-link">Format</a>
    </div>
    <a href="/" class="nav-user-btn" id="navUser">Sign in</a>
  </nav>

  <div class="page-header">
    <div class="header-row">
      <div class="page-title">THE DATABASE</div>
      <div class="live-pill" id="livePill">
        <div class="live-dot"></div>
        <span>Loading</span>
      </div>
    </div>
  </div>

  <!-- Filter bar -->
  <div class="filter-bar" id="filterBar">
    <div class="filter-row">
      <span class="filter-group-label">Rating</span>
      <button class="f-btn on" data-f="rating" data-v="">All</button>
      <button class="f-btn" data-f="rating" data-v="3">⭐⭐⭐ Legendary</button>
      <button class="f-btn" data-f="rating" data-v="2">⭐⭐ Worth a Trip</button>
      <button class="f-btn" data-f="rating" data-v="1">⭐ Solid</button>
      <button class="f-btn" data-f="rating" data-v="0">ㄨ Skip It</button>
    </div>
    <div class="filter-row">
      <span class="filter-group-label">Style</span>
      <button class="f-btn on" data-f="style" data-v="">All</button>
      <button class="f-btn" data-f="style" data-v="NY Style">NY</button>
      <button class="f-btn" data-f="style" data-v="Neapolitan">Neapolitan</button>
      <button class="f-btn" data-f="style" data-v="Roman">Roman</button>
      <button class="f-btn" data-f="style" data-v="Detroit">Detroit</button>
      <button class="f-btn" data-f="style" data-v="Deep Dish">Deep Dish</button>
      <button class="f-btn" data-f="style" data-v="Tavern">Tavern</button>
      <button class="f-btn" data-f="style" data-v="Fast">Fast</button>
    </div>
    <div class="filter-row">
      <span class="filter-group-label">Experience</span>
      <button class="f-btn on" data-f="experience" data-v="">All</button>
      <button class="f-btn" data-f="experience" data-v="Slice">Slice</button>
      <button class="f-btn" data-f="experience" data-v="Casual Sit-Down">Casual</button>
      <button class="f-btn" data-f="experience" data-v="Full Service">Full Service</button>
      <button class="f-btn" data-f="experience" data-v="Takeout">Takeout</button>
    </div>
    <div class="filter-row" id="cityRow" style="display:none">
      <span class="filter-group-label">City</span>
      <select class="city-select" id="citySelect">
        <option value="">All Cities</option>
      </select>
    </div>
  </div>

  <div class="toolbar">
    <span class="result-count" id="resultCount"></span>
    <div class="sort-group">
      <button class="sort-btn on" data-sort="recent">Recent</button>
      <button class="sort-btn" data-sort="rating">Top Rated</button>
    </div>
  </div>

  <div class="content">
    <div class="grid" id="output">
      <div class="skel"></div><div class="skel"></div>
      <div class="skel"></div><div class="skel"></div>
      <div class="skel"></div><div class="skel"></div>
    </div>
  </div>

  <!-- Overlay + Drawer -->
  <div class="overlay" id="overlay" onclick="closeDrawer()"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-handle"></div>
    <div class="drawer-img" id="dImg"></div>
    <div class="drawer-body">
      <div class="d-head">
        <div class="d-name" id="dName"></div>
        <button class="d-close" onclick="closeDrawer()">×</button>
      </div>
      <div class="d-rating" id="dRating"></div>
      <div class="d-tags" id="dTags"></div>
      <hr class="d-hr">
      <div class="d-notes" id="dNotes"></div>
      <div class="d-reviewer" id="dReviewer"></div>
      <div class="d-actions" id="dActions"></div>
    </div>
  </div>

  <script type="module">
    const RATINGS = {
      3: { s: '⭐⭐⭐', l: 'Legendary' },
      2: { s: '⭐⭐',  l: 'Worth a Trip' },
      1: { s: '⭐',    l: 'Solid' },
      0: { s: 'ㄨ',    l: 'Skip It' },
    };
    const BSKY = 'https://bsky.app';

    let all = [], sortMode = 'recent';
    const F = { rating: '', style: '', experience: '', city: '' };

    async function init() {
      authCheck();
      const { getApprovedReviews } = await import('/auth.js');
      all = await getApprovedReviews({});
      buildCities();
      render();
    }

    async function authCheck() {
      try {
        const { initAuth } = await import('/auth.js');
        const auth = await initAuth();
        if (auth?.user) {
          const el = document.getElementById('navUser');
          el.textContent = '@' + auth.user.handle;
          el.href = '/profile.html';
        }
      } catch {}
    }

    function buildCities() {
      const cities = [...new Set(all.map(r => (r.city||r.location?.split(',')[0]||'').trim()).filter(Boolean))].sort();
      if (cities.length < 2) return;
      const sel = document.getElementById('citySelect');
      cities.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });
      document.getElementById('cityRow').style.display = 'flex';
      sel.addEventListener('change', () => { F.city = sel.value; render(); });
    }

    function render() {
      let reviews = all.filter(r => {
        if (F.rating !== '' && r.rating !== parseInt(F.rating)) return false;
        if (F.style && r.style !== F.style) return false;
        if (F.experience && r.experience !== F.experience) return false;
        if (F.city && (r.city||r.location?.split(',')[0]||'').trim() !== F.city) return false;
        return true;
      });
      if (sortMode === 'rating') {
        reviews.sort((a, b) => b.rating - a.rating || new Date(b.created_at) - new Date(a.created_at));
      } else {
        reviews.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      }

      const liveEl = document.getElementById('livePill');
      liveEl.innerHTML = `<div class="live-dot"></div><span>${all.length} review${all.length !== 1 ? 's' : ''}</span>`;
      document.getElementById('resultCount').textContent =
        reviews.length === all.length ? `${all.length} review${all.length !== 1 ? 's' : ''}` : `${reviews.length} of ${all.length}`;

      const out = document.getElementById('output');
      if (!reviews.length) {
        out.innerHTML = `<div class="empty"><div class="empty-icon">🍕</div><div class="empty-title">No reviews match these filters</div><div class="empty-sub">Try a different combination, or <a href="#" onclick="clearAll();return false">clear filters</a>.</div></div>`;
        return;
      }

      const grouped = groupByCity(reviews);
      const showGroups = !F.city && grouped.length > 1 && sortMode === 'recent';

      let html = '';
      if (showGroups) {
        grouped.forEach(({ city, reviews: cr }) => {
          html += `<div class="city-section"><div class="city-heading"><span class="city-name">${city}</span><div class="city-line"></div><span class="city-count">${cr.length}</span></div><div class="grid">${cr.map(buildCard).join('')}</div></div>`;
        });
        // Override output with sections
        out.innerHTML = '';
        out.className = ''; // remove grid class
        out.style.display = 'block';
        out.innerHTML = html;
        return;
      }

      out.className = 'grid';
      out.style.display = '';
      out.innerHTML = reviews.map(buildCard).join('');
    }

    function groupByCity(reviews) {
      const map = {};
      reviews.forEach(r => {
        const c = (r.city || r.location?.split(',')[0] || 'Other').trim();
        if (!map[c]) map[c] = [];
        map[c].push(r);
      });
      return Object.entries(map).sort(([a],[b]) => a.localeCompare(b)).map(([city, reviews]) => ({ city, reviews }));
    }

    function buildCard(r) {
      const rt = RATINGS[r.rating] || RATINGS[1];
      const handle = r.users?.handle || 'contributor';
      const hasImg = !!r.image_url;
      const date = new Date(r.created_at).toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
      let bskyUrl = '';
      if (r.bluesky_uri) {
        const parts = r.bluesky_uri.split('/');
        bskyUrl = `${BSKY}/profile/${handle}/post/${parts[parts.length-1]}`;
      }
      const priceBadge = r.price ? `<span class="tag price">${r.price}</span>` : '';
      const expBadge = r.experience ? `<span class="tag">${r.experience}</span>` : '';

      const footer = `
        <div class="card-footer">
          <span class="card-reviewer">@${handle} · ${date}</span>
          ${bskyUrl ? `<a class="card-discuss" href="${bskyUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Discuss ↗</a>` : ''}
        </div>`;

      if (hasImg) {
        return `
          <div class="card" onclick="openDrawer('${r.id}')">
            <div class="card-img">
              <img src="${r.image_url}" alt="${r.name}" loading="lazy">
              <div class="rating-badge">${rt.s} ${rt.l}</div>
            </div>
            <div class="card-body">
              <div class="card-name">${r.name}</div>
              <div class="card-meta">
                <span>${r.location}</span>
                <span class="meta-sep">·</span>
                <span class="tag style">${r.style}</span>
                ${priceBadge}${expBadge}
              </div>
              <div class="card-excerpt">${r.notes||''}</div>
              ${footer}
            </div>
          </div>`;
      } else {
        return `
          <div class="card no-img r${r.rating}" onclick="openDrawer('${r.id}')">
            <div class="card-body">
              <div class="card-inline-rating">
                ${rt.s} <span class="card-inline-lbl">${rt.l}</span>
              </div>
              <div class="card-name">${r.name}</div>
              <div class="card-meta">
                <span>${r.location}</span>
                <span class="meta-sep">·</span>
                <span class="tag style">${r.style}</span>
                ${priceBadge}${expBadge}
              </div>
              <div class="card-excerpt">${r.notes||''}</div>
              ${footer}
            </div>
          </div>`;
      }
    }

    window.openDrawer = function(id) {
      const r = all.find(x => x.id === id);
      if (!r) return;
      const rt = RATINGS[r.rating] || RATINGS[1];
      const handle = r.users?.handle || 'contributor';
      const date = new Date(r.created_at).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

      document.getElementById('dImg').innerHTML = r.image_url
        ? `<img src="${r.image_url}" alt="${r.name}" loading="lazy">`
        : `<div class="drawer-placeholder">🍕</div>`;
      document.getElementById('dName').textContent = r.name;
      document.getElementById('dRating').innerHTML = `${rt.s} <span class="d-rating-lbl">${rt.l}</span>`;

      const tags = [
        { t: r.location, hi: false },
        { t: r.style, hi: true },
        r.experience ? { t: r.experience, hi: false } : null,
        r.price ? { t: r.price, hi: false, cls: 'price' } : null,
      ].filter(Boolean);
      document.getElementById('dTags').innerHTML = tags.map(({ t, hi, cls }) =>
        `<span class="d-tag ${hi ? 'hi' : ''} ${cls||''}">${t}</span>`).join('');

      document.getElementById('dNotes').textContent = r.notes || '';
      document.getElementById('dReviewer').innerHTML = `
        <div class="d-av">${handle[0].toUpperCase()}</div>
        <div style="flex:1;min-width:0">
          <div class="d-reviewer-handle">@${handle}</div>
          <span class="d-reviewer-badge">Contributor</span>
        </div>
        <div class="d-reviewer-date">${date}</div>`;

      let actions = '<button class="d-btn d-btn-outline" onclick="closeDrawer()">Close</button>';
      if (r.bluesky_uri) {
        const parts = r.bluesky_uri.split('/');
        const url = `${BSKY}/profile/${handle}/post/${parts[parts.length-1]}`;
        actions = `<a href="${url}" target="_blank" rel="noopener" class="d-btn d-btn-gold">Discuss on Bluesky ↗</a>` + actions;
      }
      document.getElementById('dActions').innerHTML = actions;

      document.getElementById('overlay').classList.add('open');
      document.getElementById('drawer').classList.add('open');
      document.body.style.overflow = 'hidden';
    };

    window.closeDrawer = function() {
      document.getElementById('overlay').classList.remove('open');
      document.getElementById('drawer').classList.remove('open');
      document.body.style.overflow = '';
    };

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

    document.querySelectorAll('.f-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll(`[data-f="${btn.dataset.f}"]`).forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        F[btn.dataset.f] = btn.dataset.v;
        render();
      });
    });
    document.querySelectorAll('.sort-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        sortMode = btn.dataset.sort;
        render();
      });
    });
    window.clearAll = function() {
      F.rating = ''; F.style = ''; F.experience = ''; F.city = '';
      document.querySelectorAll('.f-btn').forEach(b => b.classList.toggle('on', b.dataset.v === ''));
      document.getElementById('citySelect').value = '';
      render();
    };

    init();
  </script>
</body>
</html>
