<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stats — Pizza Official</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%95%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pizza-theme.css">
<style>
  a.logo { text-decoration:none; } a.tab { text-decoration:none; display:inline-block; }

  .doc-wrap { max-width:720px; margin:0 auto; padding:40px 20px 90px; }
  .eyebrow { font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--presence); margin-bottom:12px; }
  h1 { font-family:var(--font-display); font-size:42px; letter-spacing:1.5px; color:var(--red); line-height:1; margin-bottom:8px; }
  .doc-section { margin-top:42px; padding-top:28px; border-top:1px solid var(--border); }
  .doc-head { font-family:var(--font-display); font-size:24px; letter-spacing:1.5px; color:var(--red); margin-bottom:16px; }

  .stat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:8px; }
  .stat-cell { background:var(--surface); border:1px solid var(--border); padding:22px 16px; text-align:center; }
  .stat-num { font-family:var(--font-display); font-size:48px; color:var(--text); line-height:1; }
  .stat-lab { font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--text-2); margin-top:8px; }

  .bar-row { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .bar-lab { font-size:13px; min-width:150px; }
  .bar-track { flex:1; height:14px; background:var(--inset); border:1px solid var(--border); overflow:hidden; }
  .bar-fill { height:100%; width:0; transition:width .5s; }
  .bar-n { font-family:var(--font-display); font-size:18px; color:var(--text); min-width:32px; text-align:right; }

  .city-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--raised); }
  .city-name { font-size:14px; color:var(--text); flex:0 0 150px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .city-track { flex:1; height:8px; background:var(--inset); }
  .city-fill { height:100%; background:var(--red); }
  .city-n { font-size:13px; color:var(--text-2); flex:0 0 28px; text-align:right; }

  .lb-row { display:flex; align-items:center; gap:14px; padding:13px 14px; border-bottom:1px solid var(--raised); }
  .lb-row.top { background:var(--ground-selected); border-left:3px solid var(--presence); }
  .lb-rank { font-family:var(--font-display); font-size:24px; color:var(--red); min-width:36px; }
  .lb-row.top .lb-rank { color:var(--presence); }
  .lb-av { width:34px; height:34px; border-radius:50%; background:var(--raised); border:1px solid var(--red); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:16px; color:var(--red); flex-shrink:0; }
  .lb-handle { flex:1; font-size:13px; color:var(--text); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb-count { font-family:var(--font-display); font-size:22px; color:var(--text); flex-shrink:0; }
  .lb-count span { font-family:var(--font-body); font-size:11px; color:var(--text-3); margin-left:5px; }

  .site-footer { border-top:1px solid var(--border); background:var(--surface); margin-top:40px; padding:22px 20px; }
  .footer-inner { max-width:1100px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .footer-links { display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
  .footer-links a { font-family:var(--font-body); font-size:12px; letter-spacing:0.5px; color:var(--text-2); text-decoration:none; }
  .footer-links a:hover, .footer-links a.active { color:var(--red); }
  .footer-copy { font-size:11px; color:var(--text-3); }

  @media (max-width:760px) {
    .nav { gap:12px; } .nav-left { gap:14px; min-width:0; flex:1; }
    .tabs { overflow-x:auto; -webkit-overflow-scrolling:touch; gap:2px; scrollbar-width:none; }
    .tabs::-webkit-scrollbar { display:none; }
    .tab { flex:0 0 auto; white-space:nowrap; padding:8px 11px; }
    .footer-inner { flex-direction:column; align-items:flex-start; gap:14px; }
    .stat-grid { grid-template-columns:repeat(2,1fr); }
    .bar-lab { min-width:0; width:100%; font-size:12px; }
    .bar-row { flex-wrap:wrap; gap:6px 12px; }
    .bar-row .bar-track { flex:1; min-width:120px; }
    .bar-row .bar-n { min-width:24px; }
  }
</style>
</head>
<body>
<div class="nav">
  <div class="nav-left">
    <a class="logo" href="/">PIZZA<span class="bolt">⚡</span>OFFICIAL</a>
    <div class="tabs">
      <a class="tab" href="/database.html">Database</a>
      <a class="tab" href="/map.html">Map</a>
      <a class="tab" href="/submit.html">Post a Review</a>
    </div>
  </div>
  <div class="nav-id" id="navId"><span class="dot out"></span>Not signed in</div>
</div>

<div class="doc-wrap">
  <div class="eyebrow">◈ By the numbers</div>
  <h1>The Stats</h1>

  <div class="stat-grid">
    <div class="stat-cell"><div class="stat-num" id="sTotal">—</div><div class="stat-lab">Pizzas Logged</div></div>
    <div class="stat-cell"><div class="stat-num" id="sCities">—</div><div class="stat-lab">Cities</div></div>
    <div class="stat-cell"><div class="stat-num" id="sContribs">—</div><div class="stat-lab">Contributors</div></div>
    <div class="stat-cell"><div class="stat-num" id="sYear">—</div><div class="stat-lab">This Year</div></div>
  </div>

  <div class="doc-section">
    <div class="doc-head">By rating</div>
    <div class="bar-row"><span class="bar-lab" style="color:var(--rate-legendary)">⚡ Legendary</span><div class="bar-track"><div class="bar-fill" id="barLegendary" style="background:var(--rate-legendary)"></div></div><span class="bar-n" id="nLegendary">—</span></div>
    <div class="bar-row"><span class="bar-lab" style="color:var(--rate-worth)">⭐⭐ Worth A Trip</span><div class="bar-track"><div class="bar-fill" id="barTrip" style="background:var(--rate-worth)"></div></div><span class="bar-n" id="nTrip">—</span></div>
    <div class="bar-row"><span class="bar-lab" style="color:var(--rate-solid)">⭐ Solid</span><div class="bar-track"><div class="bar-fill" id="barSolid" style="background:var(--rate-solid)"></div></div><span class="bar-n" id="nSolid">—</span></div>
    <div class="bar-row"><span class="bar-lab" style="color:var(--rate-skip-text)">ㄨ Skip It</span><div class="bar-track"><div class="bar-fill" id="barSkip" style="background:var(--rate-skip-fill)"></div></div><span class="bar-n" id="nSkip">—</span></div>
  </div>

  <div class="doc-section">
    <div class="doc-head">By city</div>
    <div id="cityList"></div>
  </div>

  <div class="doc-section">
    <div class="doc-head">Leaderboard</div>
    <div class="lb" id="leaderboard"></div>
  </div>
</div>

<script src="pizza-config.js"></script>
<script type="module">
  import { initAuth } from '/auth.js';
  (async () => {
    try {
      const auth = await initAuth();
      if (auth?.user) {
        document.getElementById('navId').innerHTML = '<span class="dot"></span>@' + auth.user.handle;
      }
    } catch {}
  })();
</script>
<script>
  function renderStats(){
    const total=reviews.length;
    const cities=new Set(reviews.map(r=>r.loc)).size;
    const byHandle={};
    reviews.forEach(r=>{
      if(!byHandle[r.by]) byHandle[r.by]={n:0, avatar:r.byAvatar||''};
      byHandle[r.by].n++;
      if(!byHandle[r.by].avatar && r.byAvatar) byHandle[r.by].avatar=r.byAvatar;
    });
    const contribs=Object.keys(byHandle).length;
    document.getElementById('sTotal').textContent=total;
    document.getElementById('sCities').textContent=cities;
    document.getElementById('sContribs').textContent=contribs;
    const thisYear = new Date().getFullYear();
    document.getElementById('sYear').textContent = reviews.filter(r=>{
      const d = r.createdAt ? new Date(r.createdAt) : null;
      return d && !isNaN(d) && d.getFullYear()===thisYear;
    }).length;

    const counts={legendary:0,trip:0,solid:0,skip:0};
    reviews.forEach(r=>{ if(counts[r.rating]!==undefined) counts[r.rating]++; });
    const max=Math.max(...Object.values(counts),1);
    const set=(bar,n,key)=>{ document.getElementById(n).textContent=counts[key]; document.getElementById(bar).style.width=(counts[key]/max*100)+'%'; };
    set('barLegendary','nLegendary','legendary'); set('barTrip','nTrip','trip');
    set('barSolid','nSolid','solid'); set('barSkip','nSkip','skip');

    const byCity={}; reviews.forEach(r=>{ byCity[r.loc]=(byCity[r.loc]||0)+1; });
    const cityMax=Math.max(...Object.values(byCity),1);
    document.getElementById('cityList').innerHTML=Object.entries(byCity).sort((a,b)=>b[1]-a[1]).map(([c,n])=>
      '<div class="city-row"><span class="city-name">'+c+'</span><div class="city-track"><div class="city-fill" style="width:'+(n/cityMax*100)+'%"></div></div><span class="city-n">'+n+'</span></div>').join('');

    const lb=Object.entries(byHandle).sort((a,b)=>b[1].n-a[1].n);
    document.getElementById('leaderboard').innerHTML = lb.length ? lb.map(([h,info],i)=>{
      const initial=(h||'?').charAt(0).toUpperCase();
      const av = info.avatar
        ? '<div class="lb-av" style="overflow:hidden;padding:0;"><img src="'+info.avatar+'" alt="" style="width:100%;height:100%;object-fit:cover;display:block;" onerror="this.parentNode.textContent=\''+initial+'\'"></div>'
        : '<div class="lb-av">'+initial+'</div>';
      return '<div class="lb-row'+(i===0?' top':'')+'"><span class="lb-rank">'+(i+1)+'</span>'+
        av+
        '<span class="lb-handle">'+h+'</span>'+
        '<span class="lb-count">'+info.n+'<span>pizzas</span></span></div>';
    }).join('')
    : '<div style="color:var(--text-3);font-size:13px;padding:14px 0;">No contributors yet.</div>';
  }
  (async()=>{ await loadReviews(); renderStats(); })();
</script>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-links">
      <a href="/stats.html" class="active">Stats</a>

</body>
</html>
